name: PR title

# PRs are squash-merged, so the title becomes the commit message on main.
# `edited` re-runs the check when only the title changes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh "$TITLE"
