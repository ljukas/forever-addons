name: Release

# Push a tag named <Addon>-v<semver>, e.g. MyAddon-v1.2.0 or MyAddon-v1.3.0-beta1.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse tag
        id: tag
        run: |
          addon="${GITHUB_REF_NAME%-v*}"
          version="v${GITHUB_REF_NAME##*-v}"
          [[ -f "addons/$addon/$addon.toc" ]] || { echo "::error::No addons/$addon/$addon.toc for tag $GITHUB_REF_NAME"; exit 1; }
          echo "addon=$addon" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package (and upload to CurseForge/Wago when configured)
        env:
          PACKAGER_ARGS: "" # enable uploads; each site is skipped unless its key and TOC project ID exist
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: scripts/package.sh "${{ steps.tag.outputs.addon }}" "${{ steps.tag.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ADDON: ${{ steps.tag.outputs.addon }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Release notes: the "## <version>" section of the addon's CHANGELOG.md.
          touch "addons/$ADDON/CHANGELOG.md"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "addons/$ADDON/CHANGELOG.md" > notes.md
          [[ -s notes.md ]] || echo "No CHANGELOG.md section for $VERSION." > notes.md
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" .release/"$ADDON"/*.zip \
            --title "$ADDON $VERSION" --notes-file notes.md $prerelease
